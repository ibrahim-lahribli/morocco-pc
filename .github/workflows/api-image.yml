name: api-image

# The API image is what Render/Fly actually run: apps/api/Dockerfile with the repository
# root as context. Nothing in ci.yml builds it, and since the step 4B extraction the
# image needs packages/recommendation-core at runtime (src/recommendation/ shims resolve
# ../../../packages/recommendation-core/src at require time). A source-only test cannot
# see a missing COPY, so this workflow builds the real image and starts it.
#
# Path-filtered like web.yml: an unrelated change pays nothing, and this job does not
# duplicate the engine gates in ci.yml. The workflow file is its own trigger so an edit
# to the gate runs the gate.

on:
  push:
    paths:
      - "apps/api/Dockerfile"
      - ".dockerignore"
      - "apps/api/**"
      - "src/recommendation/**"
      - "packages/recommendation-core/**"
      - "packages/database-guard/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - "fly.toml"
      - ".github/workflows/api-image.yml"
  pull_request:
    paths:
      - "apps/api/Dockerfile"
      - ".dockerignore"
      - "apps/api/**"
      - "src/recommendation/**"
      - "packages/recommendation-core/**"
      - "packages/database-guard/**"
      - "package.json"
      - "package-lock.json"
      - "render.yaml"
      - "fly.toml"
      - ".github/workflows/api-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the deployment image (root context)
        run: docker build -f apps/api/Dockerfile -t morocco-pc-api:ci .

      - name: Confirm the extracted core is in the image
        run: |
          docker run --rm --entrypoint sh morocco-pc-api:ci -c '
            set -e
            test -f /app/packages/recommendation-core/package.json
            test -d /app/packages/recommendation-core/src
            test ! -e /app/apps/web
            find /app/packages/recommendation-core -type f | sort
          '

      - name: Confirm the shipped core matches its declared interface
        run: |
          # The interface is package.json `exports` (RFC section 11.4), not a
          # barrel per directory: `./offers` is src/offers/as-of.js and there is
          # no offers/index.js. Every declared target must exist in the image and
          # resolve under src/ (which rejects an unauthorized ./package.json
          # target), every published namespace must have a declared subpath and
          # expose something, and each subpath must load the same object the
          # entry publishes. No namespace list is hardcoded here.
          docker run --rm --entrypoint node morocco-pc-api:ci -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const ROOT = '/app/packages/recommendation-core';
            const SRC = path.join(ROOT, 'src');
            const fail = (message) => { console.error('core surface: ' + message); process.exit(1); };
            const manifest = JSON.parse(fs.readFileSync(path.join(ROOT, 'package.json'), 'utf8'));
            const map = manifest.exports;
            if (!map || typeof map !== 'object' || Array.isArray(map)) fail('package must declare an exports map');
            if (map['.'] !== './' + manifest.main) fail('exports root must name main');
            for (const [subpath, target] of Object.entries(map)) {
              if (typeof target !== 'string' || !target.startsWith('./')) fail(subpath + ' must map to a relative target');
              const resolved = path.resolve(ROOT, target);
              if (!resolved.startsWith(ROOT + path.sep)) fail(subpath + ' escapes the package');
              if (!resolved.startsWith(SRC + path.sep)) fail(subpath + ' must resolve under src/');
              if (!fs.existsSync(resolved)) fail(subpath + ' target is missing from the image');
            }
            const core = require(SRC);
            const namespaces = Object.keys(core);
            if (namespaces.length === 0) fail('core surface is empty');
            for (const name of namespaces) {
              const ns = core[name];
              if (ns === null || typeof ns !== 'object') fail(name + ' is not a namespace object');
              if (Object.keys(ns).length === 0) fail(name + ' exports nothing');
              const target = map['./' + name];
              if (typeof target !== 'string') fail(name + ' has no declared subpath');
              if (require(path.resolve(ROOT, target)) !== ns) fail(name + ' is not the module its subpath declares');
            }
            for (const [subpath, target] of Object.entries(map)) {
              if (subpath === '.') continue;
              const loaded = require(path.resolve(ROOT, target));
              if (loaded === null || (typeof loaded !== 'object' && typeof loaded !== 'function')) fail(subpath + ' loads nothing');
              if (typeof loaded === 'object' && Object.keys(loaded).length === 0) fail(subpath + ' exports nothing');
            }
            require('/app/apps/api/src/engine.js');
            console.log('core surface OK (' + namespaces.join(',') + '); engine graph OK');
          "

      - name: Boot, health-check, clean up
        run: |
          set -uo pipefail
          docker run -d --name api-image-ci -p 18080:3000 \
            -e API_ALLOW_SHARED=1 -e ENGINE_VERSION=ci-image \
            -e DATABASE_URL='postgresql://api:api@127.0.0.1:1/ci-image' \
            morocco-pc-api:ci > /dev/null
          ok=0
          for _ in $(seq 1 60); do
            if [ -z "$(docker ps -q -f 'name=^api-image-ci$')" ]; then
              echo "::error::container exited before answering"
              break
            fi
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:18080/v1/health || true)
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 1
          done
          docker logs api-image-ci > /tmp/api-ci.log 2>&1 || true
          cat /tmp/health.json 2>/dev/null || true
          cat /tmp/api-ci.log
          docker rm -f api-image-ci > /dev/null 2>&1 || true
          test "$ok" = "1"
          jq -e '.status == "ok" and .engine_version == "ci-image"' /tmp/health.json > /dev/null
          grep -q 'morocco-pc API listening' /tmp/api-ci.log
          ! grep -q 'MODULE_NOT_FOUND' /tmp/api-ci.log
          echo "health: $(cat /tmp/health.json)"
          echo "note: the db field is expected to be \"down\" - no database is attached to this smoke container"
