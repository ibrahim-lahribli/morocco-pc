name: web-ci

# apps/web is a standalone package (OD4): own package.json, own lockfile, own
# workflow. The engine's ci.yml is deliberately untouched — its unit-and-docs
# job must never depend on the web toolchain (V14). Path-filtered so it only
# runs when web files or this workflow change.
on:
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # S4 contract gate: fails when the committed types drift from the API snapshot,
      # when the snapshot leaves 1.5.0, or when the path set changes.
      - run: npm run check:api-types
      - run: npm run build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - run: npm test
