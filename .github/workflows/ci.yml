name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:17 UTC nightly - off the hour, so it does not pile onto :00 with other repos.
    - cron: "17 3 * * *"

jobs:
  unit-and-docs:
    # The schedule event exists for recurring-gates only. Running this job on it
    # too would duplicate the push/PR signal nightly and, if it failed, file the
    # failure under the wrong job. workflow_dispatch still runs everything.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The engine suites need no dependencies, but test:api requires the
      # API dependencies (fastify, typebox, pg).
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:scripts
      # DB-free API contract/route tests (fastify.inject + stubs; no database).
      - run: npm run test:api
      - run: node scripts/gen-decision-index.js --check
      - run: node scripts/verify-docs.js --offline
      # R-21 (2026-11-03): the catalogue-identity gate ran nightly only, which is
      # precisely how R-07 - 13 ACTIVE products with no slug/display_name on shared,
      # 100 on EU - reached a deployed origin and shipped `components[].slug: null`.
      # The gate is READ-ONLY (SELECTs only), so it belongs on the change as well as
      # on the clock. A pull_request from a fork receives no secrets; rather than
      # fail every outside contribution, the step reports a NOTICE and exits 0, and
      # the nightly recurring-gates copy still covers that branch. With the secret
      # present this is a hard gate: a FAIL exits 1 and the job goes red.
      - name: Catalogue identity (push/PR)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=catalogue-identity::DATABASE_URL is not set, so the gate is skipped here; recurring-gates still runs it nightly"
            exit 0
          fi
          node scripts/check-catalog-identity.js

      # Decision 26 item B calls check-deferred-rules.js the binding pre-merge
      # re-check for any CPU/cooler/case/RAM/motherboard seed, but it was in NO
      # workflow at all - the rule held only for whoever read the recipe. It is
      # READ-ONLY and measured PASS on shared on 2026-11-04 (0 violations in every
      # scope, all four rules ENFORCED), which is what makes it a gate rather than
      # a warning. Unlike the identity gate it has no nightly fallback for a fork
      # PR without the secret, so the NOTICE says so instead of promising cover.
      - name: Deferred rules (push/PR)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=deferred-rules::DATABASE_URL is not set, so this gate is skipped; run node scripts/check-deferred-rules.js locally (read-only)"
            exit 0
          fi
          node scripts/check-deferred-rules.js

  recurring-gates:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Least privilege: this job only reads the repo and talks to Neon.
    permissions:
      contents: read
    # Queue rather than overlap. verify-migrations-replay.js creates and drops a
    # single scratch database (migrations_replay_tmp) on the TEST instance, so two
    # concurrent runs would fight over the same name. cancel-in-progress: false so
    # a slow run is never killed part-way through a CREATE/DROP against the real DB.
    concurrency:
      group: recurring-gates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert secrets are present
        # Fail with a named error instead of a DB connection timeout. GitHub masks
        # secret values in logs, but an unset secret would otherwise surface as a
        # confusing downstream failure.
        run: |
          test -n "${{ secrets.DATABASE_URL }}" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }
          test -n "${{ secrets.TEST_DATABASE_URL }}" || { echo "::error::TEST_DATABASE_URL secret is not set"; exit 1; }
      - id: deps
        run: npm ci
      # --fail-days=14, NOT the default 7 and NOT the space-separated form: the
      # script parses --fail-days=N and rejects "--fail-days 14" with exit 2. A
      # nightly job on a 7-day threshold would only page someone a week before the
      # cliff, too late to re-stamp offers.
      - run: node scripts/check-offer-freshness.js --fail-days=14
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Is there a RETAILER behind each price? INCONCLUSIVE (no non-seed offer
      # exists) exits 0 on purpose; only an unprovenanced non-seed offer fails.
      - run: node scripts/check-offer-provenance.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Does every ACTIVE product still carry the identity the API serves and
      # addresses? Seeds 023-025 once inserted 13 rows with NULL slug/display_name
      # and shipped a `slug: null` component to the deployed origin
      # (HANDOFF_2026-11-01). RED here means catalogue DATA: the repair is a seed,
      # not a code change.
      - run: node scripts/check-catalog-identity.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Read-only, and the only place this rule would otherwise run.
      - run: node scripts/check-deferred-rules.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: node scripts/verify-migrations-replay.js --test-db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # DB-backed API tests: the real engine against the TEST branch. Wired
      # 2026-10-07; first executed on GitHub 2026-10-18 (workflow_dispatch run
      # 39120485573) and PASSED - "test:api:db: 9 passed, 0 failed" on the runner.
      #
      # if: always() so the replay above cannot hide it. The two gates are
      # independent and the replay is EXPECTED to fail while a migration is
      # branch-only (021/022 against the shared ledger) - which is exactly when a
      # reader needs to know whether the DB-backed suite passed. Still gated on
      # the dependency install: always() alone would run this after a failed
      # npm ci and report a second, misleading failure.
      - name: DB-backed API tests
        if: always() && steps.deps.outcome == 'success'
        run: npm run test:api:db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # V1's "a POST completes in under 3 s" has no deployed origin to measure on,
      # and a local run cannot stand in: on 2026-10-23 the dev box measured a median
      # 120-205 ms per `SELECT 1`, which puts a 49-statement pass at 6-10 s of round
      # trip ALONE - a property of that machine's distance from Neon, not of the
      # product. This step reports the same band from a runner so the target is
      # judged against a repeatable number instead of a guess: statements x RTT is a
      # floor every origin pays, and an origin colocated with its database would pay
      # ~1-2 ms per statement instead of ~200.
      #
      # READ ONLY - the script issues `SELECT 1` and nothing else, takes no lock and
      # writes nothing, so it is safe against the shared database too. INFORMATIONAL:
      # the figures are printed, never asserted, because no threshold is defensible
      # until an origin exists; the step fails only if a target cannot be reached.
      # if: always() for the same reason as the suite above - an unrelated red gate
      # must not hide the number.
      - name: DB round-trip band (V1 latency input)
        if: always() && steps.deps.outcome == 'success'
        run: |
          node scripts/measure-db-roundtrip.js --target=env:DATABASE_URL
          node scripts/measure-db-roundtrip.js --target=env:TEST_DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # Assessment age - nightly WARNING, never a gate. `per_day_decay` is 0 in
      # launch-v2@2.5.0 (seed 029), so nothing in the engine degrades an ageing
      # assessment any more; the catalogue's evidence staleness still needs to be
      # VISIBLE, but nobody agreed to gate a nightly job on it (a red nightly for
      # a data property is worse than no step).
      #
      # Warning-only by construction, three independent ways:
      #   * `continue-on-error: true` - the job ignores this step's exit status;
      #   * `set +e` plus `|| echo ::warning` - a non-zero exit becomes an
      #     annotation instead of a failure;
      #   * the script exits 0 unless `--strict` is passed, and this step never
      #     passes it (that default is pinned by scripts/lib/assessment-age-cli.test.js).
      # It lives in `recurring-gates` ONLY (schedule + workflow_dispatch), so a
      # push/PR never runs it. scripts/lib/ci-workflow.test.js pins all of that.
      - name: Assessment age (nightly warning, never a gate)
        if: always() && steps.deps.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          node scripts/check-assessment-age.js --target=env:DATABASE_URL \
            || echo "::warning title=assessment age::the age report did not complete; this step never fails the job"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
