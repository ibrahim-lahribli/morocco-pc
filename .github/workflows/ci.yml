name: ci

on:
  push:
  pull_request:

jobs:
  unit-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:unit
      - run: npm run test:scripts
      - run: node scripts/gen-decision-index.js --check
      - run: node scripts/verify-docs.js --offline
