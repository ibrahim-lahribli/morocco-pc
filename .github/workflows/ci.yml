name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # 03:17 UTC nightly - off the hour, so it does not pile onto :00 with other repos.
    - cron: "17 3 * * *"

jobs:
  unit-and-docs:
    # The schedule event exists for recurring-gates only. Running this job on it
    # too would duplicate the push/PR signal nightly and, if it failed, file the
    # failure under the wrong job. workflow_dispatch still runs everything.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      # Full history: the compatibility gate diffs the candidate contract against
      # `origin/master` from Git, so a shallow clone would make the baseline
      # unreadable and the gate would have to fail (or, worse, skip).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The engine suites need no dependencies, but test:api requires the
      # API dependencies (fastify, typebox, pg).
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:scripts
      # Layer boundaries (dependency-cruiser): the web app never imports the API,
      # the API reaches the engine only through engine.js, the engine never reads
      # the schema, the pure core has no third-party or outward edges, ingestion
      # stays inside its stage, and the runtime package never imports pg/dotenv.
      # Violations that predate the rules live in the committed baseline; only a
      # NEW one fails, so this is a ratchet, not a cleanup backlog.
      - run: npm run lint:boundaries
      # The extracted database guard's own suite. It left scripts/lib/ in step 3a,
      # so `test:scripts` no longer covers it: a run without this step would drop
      # coverage silently instead of moving it.
      - run: npm run test:database-guard
      # The pure core package's hermetic boundary harness (step 4B): the entry
      # point loads through its declared `main`, the export surface matches the
      # committed snapshot, and every file under src/ passes the purity scan.
      # DB-free and dependency-free by construction, so it needs nothing but
      # Node.
      - run: npm run test:core
      # RFC §11.6 "Hermetic run". An empty dependency list in package.json is a
      # claim, not proof: a core test could still resolve something from the
      # repository's node_modules. This copies the package OUTSIDE the
      # repository, refuses to run when any node_modules is reachable from the
      # copy, empties NODE_PATH, runs the package's own test command there and
      # removes the copy even if the run fails.
      - run: node packages/recommendation-core/test/hermetic-run.js
      # Step 5's package harness (the runtime package). `assert-discovery.js`
      # runs first and exits 1 when a required suite is absent, because
      # `node --test` exits 0 when a glob matches nothing - a gate that passes
      # because it discovered no tests is worse than no gate. The quoted glob is
      # expanded by Node (same mechanism as test:core) and matches only the
      # *.test.js suites (25 after W3 + F1), never the helpers
      # (`assert-discovery.js`, `boundary-scanner.js`,
      # `composite-lifecycle-scanner.js`, `recording-client.js`).
      - name: Runtime package harness (step 5)
        run: npm run test:runtime
      # --- Step 4B extraction evidence (PR 3) -------------------------------
      # Three guarantees that used to live only in a review write-up are gates
      # now. All three are READ-ONLY and DB-free; they read Git history, which is
      # why the full-history checkout above is load-bearing.
      #   * L2  - the frozen characterization fixture still reproduces the
      #           PRE-MOVE implementation's behaviour, and --check never writes;
      #   * L3  - every move declared in extraction-manifest.json is
      #           blob-identical to its immutable batch baseline, and each
      #           characterized batch's fixture predates its move;
      #   * ownership - every moved/stayed/split test file keeps its test and
      #           assertion counts, and an added test is never counted as moved.
      # Separate NAMED steps: a red run names the guarantee that broke instead of
      # pointing at one opaque "verify" step.
      - name: Extraction characterization (L2, frozen fixture)
        run: npm run check:characterization
      # Step 4B PR 3's own fixture. `check:characterization` above is wired to
      # the PR 2 document only, so a second batch needs its own entry or its
      # behaviour is not checked anywhere.
      - name: Extraction characterization (L2, assembly fixture)
        run: npm run check:characterization:pr3
      # Step 4B PR 4's own fixture: the ranking stage. Same reason as the
      # assembly step above - one entry per batch, or the batch is unchecked.
      - name: Extraction characterization (L2, ranking fixture)
        run: npm run check:characterization:pr4
      # Step 4B PR 5's own fixture: the retention stage. One entry per batch, or
      # the batch is unchecked.
      - name: Extraction characterization (L2, retention fixture)
        run: npm run check:characterization:pr5
      # Step 4B PR 6's own fixture: the scoring stage. One entry per batch, or
      # the batch is unchecked.
      - name: Extraction characterization (L2, scoring fixture)
        run: npm run check:characterization:pr6
      # Step 4B PR 7's own fixture: the explanation / offers-as-of batch. One
      # entry per batch, or the batch is unchecked. The script and fixture land
      # with that batch, so this step requires it to merge first.
      - name: Extraction characterization (L2, explanation fixture)
        run: npm run check:characterization:pr7
      - name: Extraction provenance (L3, manifest baseline)
        run: npm run verify:extraction
      # The PR 2 baseline is passed EXPLICITLY: "the commit before the move" is
      # immutable evidence, so it is pinned here as well as in the manifest rather
      # than inherited from whatever the manifest happens to say.
      - name: Extraction test ownership (immutable PR2 baseline)
        run: npm run verify:ownership -- --base=afccc671dae5abe6df80ad56dfcbc231d7947c7a
      # The assembly batch's own immutable baseline. The inventory is shared,
      # but the before-counts are read from the commit THAT batch moved from -
      # inheriting PR 2's baseline would measure the wrong revision and prove
      # nothing about the Engine 3 move.
      - name: Extraction test ownership (assembly baseline)
        run: npm run verify:ownership -- --inventory=pr3 --base=de659adaaf4bbde4b2e1673aae08314d07af000e
      # The ranking batch's own immutable baseline. Its fixture was captured at
      # 07dfd22, so the before-counts are read from that commit: the PR 2 and
      # PR 3 baselines predate the modules this batch moved.
      - name: Extraction test ownership (ranking baseline)
        run: npm run verify:ownership -- --inventory=pr4 --base=07dfd22be7170ede689da1a1637cfab1645cb209
      # The retention batch's own immutable baseline: the direct parent of its
      # capture commit. The earlier three baselines predate the modules this
      # batch moved, so they cannot supply its before-counts.
      - name: Extraction test ownership (retention baseline)
        run: npm run verify:ownership -- --inventory=pr5 --base=0f439e0400c6814d0a21d4ab527c462aef0f5639
      # The scoring batch's own immutable baseline: the direct parent of its
      # capture commit. The earlier four baselines predate the modules this
      # batch moved (and the retain.test.js row that moved with them), so they
      # cannot supply its before-counts.
      - name: Extraction test ownership (scoring baseline)
        run: npm run verify:ownership -- --inventory=pr6 --base=1a9d8cfbe2b7f3a3f7a1a17e80919575d52c326e
      # The explanation batch's own immutable baseline (the direct parent of its
      # capture commit). The earlier baselines predate the modules this batch
      # moved, so they cannot supply its before-counts. Requires that batch to
      # merge first: the pr7 inventory arrives with it.
      - name: Extraction test ownership (explanation baseline)
        run: npm run verify:ownership -- --inventory=pr7 --base=268371300a2c70cc32a819f072b63f0b29d3b83d
      # DB-free API contract/route tests (fastify.inject + stubs; no database).
      - run: npm run test:api
      # Contract ownership: exactly ONE versioned contract in contract/, and no
      # second copy anywhere in the tree. This is not the snapshot test — that
      # one proves the committed document is what the API serves.
      - run: npm run check:contract
      # Backward compatibility against a NAMED Git ref, never a second committed
      # baseline: `origin/master` is the revision clients were built against. An
      # additive change passes; a breaking one fails unless it carries an
      # explicit `--allow-breaking --approval-note="..."`.
      - name: OpenAPI compatibility (Git-ref baseline)
        run: node scripts/check-openapi-compatibility.js --base=origin/master
      - run: node scripts/gen-decision-index.js --check
      - run: node scripts/verify-docs.js --offline
      # R-21 (2026-11-03): the catalogue-identity gate ran nightly only, which is
      # precisely how R-07 - 13 ACTIVE products with no slug/display_name on shared,
      # 100 on EU - reached a deployed origin and shipped `components[].slug: null`.
      # The gate is READ-ONLY (SELECTs only), so it belongs on the change as well as
      # on the clock. A pull_request from a fork receives no secrets; rather than
      # fail every outside contribution, the step reports a NOTICE and exits 0, and
      # the nightly recurring-gates copy still covers that branch. With the secret
      # present this is a hard gate: a FAIL exits 1 and the job goes red.
      - name: Catalogue identity (push/PR)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=catalogue-identity::DATABASE_URL is not set, so the gate is skipped here; recurring-gates still runs it nightly"
            exit 0
          fi
          node scripts/check-catalog-identity.js

      # Decision 26 item B calls check-deferred-rules.js the binding pre-merge
      # re-check for any CPU/cooler/case/RAM/motherboard seed, but it was in NO
      # workflow at all - the rule held only for whoever read the recipe. It is
      # READ-ONLY and measured PASS on shared on 2026-11-04 (0 violations in every
      # scope, all four rules ENFORCED), which is what makes it a gate rather than
      # a warning. Unlike the identity gate it has no nightly fallback for a fork
      # PR without the secret, so the NOTICE says so instead of promising cover.
      - name: Deferred rules (push/PR)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice title=deferred-rules::DATABASE_URL is not set, so this gate is skipped; run node scripts/check-deferred-rules.js locally (read-only)"
            exit 0
          fi
          node scripts/check-deferred-rules.js

  # Golden scenario harness on a THROWAWAY Postgres (Task 4b). The harness
  # (scripts/eval-scenarios.js) refuses to run while any unmarked
  # recommendation_query row exists on its target, and the shared dev DB keeps
  # collecting them from the deployed origin - so it could never gate a push/PR.
  # A fresh service container per run has no unmarked rows by construction, and
  # carries NO secrets, so fork PRs run it too. Provenance: migrations 001-023
  # through run-migrations.js --test-db (the test-db path never appends to the
  # tracked database/migration-applies.jsonl audit log), then the full seed tail
  # through run-seeds.js. After seed 029 the newest active scoring model is
  # launch-v2@2.5.0 and seed-minimal-v1@1.0.0 is INACTIVE, so the default pin
  # would fail closed - the run pins launch-v2@2.5.0 explicitly, the pin
  # scenarios.json carries scoped approved assertions for. --no-baseline
  # --no-volatile keep CI from writing test/golden files.
  ephemeral-eval:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ephemeral
          POSTGRES_DB: morocco_eval
          # Neon parity, not a preference. The stock image clusters en_US.utf8,
          # whose collation ignores punctuation at the primary level and orders
          # 'g-skill-...' AFTER 'gigabyte-...'; the catalogue keyset walk asserts
          # code-unit slug order and Neon serves it. Measured 2026-11-22: the
          # DB suite is 16 passed / 1 failed (catalog.db.test.js) on the image
          # default and 17 / 0 on C.UTF-8.
          POSTGRES_INITDB_ARGS: "--locale=C.UTF-8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d morocco_eval"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # One container, two host spellings: database-guard's getWriteTestDbUrl()
      # requires TEST_DATABASE_URL and DATABASE_URL to name DIFFERENT hosts
      # (normalized hostname compare), so the write target is provably not the
      # shared database. localhost vs 127.0.0.1 satisfies it against a
      # throwaway container and nothing else.
      TEST_DATABASE_URL: postgres://postgres:ephemeral@localhost:5432/morocco_eval
      DATABASE_URL: postgres://postgres:ephemeral@127.0.0.1:5432/morocco_eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Apply migrations 001-023 (ephemeral)
        run: node scripts/run-migrations.js --test-db
      - name: Apply all seeds (ephemeral)
        # --confirm-shared is the opt-in, and it is deliberate here: the seeder
        # no longer treats a loopback host as proof of a disposable target (a
        # local port can forward to a shared database), so the job states what
        # it means instead of relying on 127.0.0.1 being an authorization.
        run: node scripts/run-seeds.js --confirm-shared
      - name: Golden scenario harness (ephemeral)
        run: npm run eval:scenarios -- --model=launch-v2@2.5.0 --no-baseline --no-volatile
      # The real loaders against the frozen loader fixtures, on the SAME fresh
      # database. The fixtures carry TEST ids, so the suite pairs candidates by
      # content identity and reports the database side by natural key; it also
      # asserts each loader statement's ORDER BY against the rows PostgreSQL
      # actually returned, which a returned value cannot show. It runs after the
      # harness for the same reason the API suite does (eval refuses unmarked
      # query rows) and cleans its own rows by id (golden-loaders-* profile).
      - name: Loader identity and order (ephemeral)
        run: npm run test:loaders:ephemeral
      # After the harness, never before: eval-scenarios.js refuses to start while
      # any unmarked recommendation_query row exists, and this suite creates such
      # rows (and deletes them by id). Job env already pins the localhost/127.0.0.1
      # pair; API_ALLOW_SHARED is deliberately absent.
      - name: DB-backed API tests (ephemeral)
        run: npm run test:api:db

  recurring-gates:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Least privilege: this job only reads the repo and talks to Neon.
    permissions:
      contents: read
    # Queue rather than overlap. verify-migrations-replay.js creates and drops a
    # single scratch database (migrations_replay_tmp) on the TEST instance, so two
    # concurrent runs would fight over the same name. cancel-in-progress: false so
    # a slow run is never killed part-way through a CREATE/DROP against the real DB.
    concurrency:
      group: recurring-gates
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert secrets are present
        # Fail with a named error instead of a DB connection timeout. GitHub masks
        # secret values in logs, but an unset secret would otherwise surface as a
        # confusing downstream failure.
        run: |
          test -n "${{ secrets.DATABASE_URL }}" || { echo "::error::DATABASE_URL secret is not set"; exit 1; }
          test -n "${{ secrets.TEST_DATABASE_URL }}" || { echo "::error::TEST_DATABASE_URL secret is not set"; exit 1; }
      - id: deps
        run: npm ci
      # --fail-days=14, NOT the default 7 and NOT the space-separated form: the
      # script parses --fail-days=N and rejects "--fail-days 14" with exit 2. A
      # nightly job on a 7-day threshold would only page someone a week before the
      # cliff, too late to re-stamp offers.
      - run: node scripts/check-offer-freshness.js --fail-days=14
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Is there a RETAILER behind each price? INCONCLUSIVE (no non-seed offer
      # exists) exits 0 on purpose; only an unprovenanced non-seed offer fails.
      - run: node scripts/check-offer-provenance.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Does every ACTIVE product still carry the identity the API serves and
      # addresses? Seeds 023-025 once inserted 13 rows with NULL slug/display_name
      # and shipped a `slug: null` component to the deployed origin
      # (HANDOFF_2026-11-01). RED here means catalogue DATA: the repair is a seed,
      # not a code change.
      - run: node scripts/check-catalog-identity.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Read-only, and the only place this rule would otherwise run.
      - run: node scripts/check-deferred-rules.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: node scripts/verify-migrations-replay.js --test-db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # DB-backed API tests: the real engine against the TEST branch. Wired
      # 2026-10-07; first executed on GitHub 2026-10-18 (workflow_dispatch run
      # 39120485573) and PASSED - "test:api:db: 9 passed, 0 failed" on the runner.
      #
      # if: always() so the replay above cannot hide it. The two gates are
      # independent and the replay is EXPECTED to fail while a migration is
      # branch-only (021/022 against the shared ledger) - which is exactly when a
      # reader needs to know whether the DB-backed suite passed. Still gated on
      # the dependency install: always() alone would run this after a failed
      # npm ci and report a second, misleading failure.
      - name: DB-backed API tests
        if: always() && steps.deps.outcome == 'success'
        run: npm run test:api:db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # V1's "a POST completes in under 3 s" has no deployed origin to measure on,
      # and a local run cannot stand in: on 2026-10-23 the dev box measured a median
      # 120-205 ms per `SELECT 1`, which puts a 49-statement pass at 6-10 s of round
      # trip ALONE - a property of that machine's distance from Neon, not of the
      # product. This step reports the same band from a runner so the target is
      # judged against a repeatable number instead of a guess: statements x RTT is a
      # floor every origin pays, and an origin colocated with its database would pay
      # ~1-2 ms per statement instead of ~200.
      #
      # READ ONLY - the script issues `SELECT 1` and nothing else, takes no lock and
      # writes nothing, so it is safe against the shared database too. INFORMATIONAL:
      # the figures are printed, never asserted, because no threshold is defensible
      # until an origin exists; the step fails only if a target cannot be reached.
      # if: always() for the same reason as the suite above - an unrelated red gate
      # must not hide the number.
      - name: DB round-trip band (V1 latency input)
        if: always() && steps.deps.outcome == 'success'
        run: |
          node scripts/measure-db-roundtrip.js --target=env:DATABASE_URL
          node scripts/measure-db-roundtrip.js --target=env:TEST_DATABASE_URL
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      # Assessment age - nightly WARNING, never a gate. `per_day_decay` is 0 in
      # launch-v2@2.5.0 (seed 029), so nothing in the engine degrades an ageing
      # assessment any more; the catalogue's evidence staleness still needs to be
      # VISIBLE, but nobody agreed to gate a nightly job on it (a red nightly for
      # a data property is worse than no step).
      #
      # Warning-only by construction, three independent ways:
      #   * `continue-on-error: true` - the job ignores this step's exit status;
      #   * `set +e` plus `|| echo ::warning` - a non-zero exit becomes an
      #     annotation instead of a failure;
      #   * the script exits 0 unless `--strict` is passed, and this step never
      #     passes it (that default is pinned by scripts/lib/assessment-age-cli.test.js).
      # It lives in `recurring-gates` ONLY (schedule + workflow_dispatch), so a
      # push/PR never runs it. scripts/lib/ci-workflow.test.js pins all of that.
      - name: Assessment age (nightly warning, never a gate)
        if: always() && steps.deps.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          node scripts/check-assessment-age.js --target=env:DATABASE_URL \
            || echo "::warning title=assessment age::the age report did not complete; this step never fails the job"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
