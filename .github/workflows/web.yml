name: web

# apps/web is a standalone package (OD4): own manifest, own lockfile, own workflow,
# so the engine's `ci.yml` jobs stay untouched. This REPLACES the scaffold-era
# `.github/workflows/web-ci.yml`, deleted here: same gates, plus Lighthouse budgets,
# artifacts and a least-privilege token — one job per web push, not two copies of
# the same eight gates racing each other.
#
# No secrets and no database: the suite drives the committed fixture mock
# (`apps/web/mock/server.mjs`), and playwright.config.ts starts both servers.

on:
  push:
    paths:
      - "apps/web/**"
      # The web client's types are generated from THIS committed snapshot (S4), so
      # a contract change is a web change even when no file under apps/web moved.
      - "apps/api/test/unit/openapi-v1.5.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/test/unit/openapi-v1.5.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    # Read-only: this job builds and tests, it never writes to the repo.
    permissions:
      contents: read
    defaults:
      run:
        # Every step below is a package script of the web app; a `uses:` step is
        # unaffected by this, which is why the artifact path stays repo-relative.
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # The static gates run first: each is seconds, and each names the rule it
      # breaks, so a failure here reads better than a Playwright trace.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:tokens
      - run: npm run check:i18n
      # The S4 drift gate: the committed schema.d.ts must still be byte-identical
      # to what the generator produces from the API's snapshot. It is why the
      # triggers above include that snapshot's path.
      - run: npm run check:api-types
      # `playwright.config.ts`'s webServer runs `next start`, so the build has to
      # exist first. The same config starts the app on 3210 and the fixture mock on
      # 3211 with API_BASE_URL pointed at the mock, so the SERVER-side fetch path is
      # what the suite exercises — a browser route interception would not be.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # S19's budgets, ENFORCED: the three assertions in lighthouserc.cjs are
      # `error` and aggregate by MEDIAN of the three runs, so a regression fails
      # this job. The harness starts the built app (3210) and the fixture mock
      # (3211) itself and refuses to measure a dev server already on the port.
      - name: Lighthouse CI (fixture route, enforced budgets)
        run: npm run test:lighthouse
      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-lighthouse-report
          path: apps/web/.lighthouseci
          # `.lighthouseci` is a DOT directory and upload-artifact skips hidden
          # files by default: without this the step reported success and uploaded
          # nothing (measured on runs 39618370244 / 39618455093).
          include-hidden-files: true
          retention-days: 7
          # `warn`, not `ignore`: on a job that failed before Lighthouse ran there
          # is legitimately nothing to upload, and an annotation says so instead
          # of a silent no-op that looks like a stored report.
          if-no-files-found: warn
      # Traces, screenshots and videos (trace: on-first-retry) only exist on a
      # failed run; a green run has nothing to upload.
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-test-results
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
