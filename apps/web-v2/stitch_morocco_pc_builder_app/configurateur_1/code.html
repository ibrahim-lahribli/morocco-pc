ce-lg select-none" dir="rtl">
<!-- Top Navigation & Progress Bar Bar -->
<div class="flex items-center justify-between w-full min-h-[44px] mb-space-md pt-space-xs"><div class="w-[44px] h-[44px] shrink-0"></div><div class="flex items-center gap-space-sm flex-1 max-w-[210px] mx-space-sm"><div class="flex items-center gap-1.5 flex-1 h-1.5"><span class="h-1.5 flex-1 bg-primary-container rounded-full"></span><span class="h-1.5 flex-1 bg-surface-dim rounded-full"></span><span class="h-1.5 flex-1 bg-surface-dim rounded-full"></span><span class="h-1.5 flex-1 bg-surface-dim rounded-full"></span></div><span class="text-[14px] text-on-surface-variant font-medium shrink-0"><bdi dir="ltr">1 / 4</bdi></span></div><div class="flex items-center bg-surface-container-high rounded-full p-0.5 shrink-0 min-h-[44px]"><span class="px-2.5 py-1.5 bg-primary-container text-on-primary rounded-full text-[13px] font-semibold shadow-sm">عربية</span><button class="px-2.5 py-1.5 text-on-surface-variant text-[13px] font-medium hover:text-on-surface transition-colors" type="button">FR</button></div></div>
<!-- Content Header -->
<div class="flex flex-col text-right mb-space-lg mt-space-xs"><h1 class="text-[28px] font-bold text-on-surface tracking-tight leading-tight">ما استخدامك الأساسي لهذا الحاسوب؟</h1><p class="text-[14px] text-on-surface-variant mt-1.5 leading-relaxed">اختر الاستخدام الرئيسي. يمكنك التغيير لاحقًا.</p></div>
<!-- Selectable Option Cards Stack -->
<div class="flex flex-col gap-space-md w-full" id="options-group"><div class="group relative flex items-center justify-between w-full p-4 min-h-[104px] bg-surface-container-lowest rounded-xl shadow-sm cursor-pointer transition-all duration-200 active:scale-[0.99] hover:bg-surface-container-low" onclick="selectOption(this, 'gaming')" role="button" tabindex="0"><div class="flex items-center flex-1 min-w-0"><div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-primary-container shrink-0 transition-colors group-hover:bg-primary-fixed"><span class="material-symbols-outlined text-[24px]">sports_esports</span></div><div class="flex flex-col text-right pr-3.5 pl-2 flex-1 min-w-0"><span class="text-[17px] text-on-surface font-semibold truncate leading-snug">ألعاب الفيديو</span><span class="text-[14px] text-on-surface-variant truncate mt-1"><bdi dir="ltr">Fortnite · Valorant · GTA V</bdi></span></div></div><div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center shrink-0 mr-2 transition-colors indicator-circle"><span class="w-2.5 h-2.5 rounded-full bg-primary-container opacity-0 transition-opacity check-dot"></span></div></div><div class="group relative flex items-center justify-between w-full p-4 min-h-[104px] bg-surface-container-lowest rounded-xl shadow-sm cursor-pointer transition-all duration-200 active:scale-[0.99] hover:bg-surface-container-low" onclick="selectOption(this, 'office')" role="button" tabindex="0"><div class="flex items-center flex-1 min-w-0"><div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-primary-container shrink-0 transition-colors group-hover:bg-primary-fixed"><span class="material-symbols-outlined text-[24px]">laptop_mac</span></div><div class="flex flex-col text-right pr-3.5 pl-2 flex-1 min-w-0"><span class="text-[17px] text-on-surface font-semibold truncate leading-snug">المكتب والإنترنت</span><span class="text-[14px] text-on-surface-variant truncate mt-1">الدراسة والمكتب والأفلام</span></div></div><div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center shrink-0 mr-2 transition-colors indicator-circle"><span class="w-2.5 h-2.5 rounded-full bg-primary-container opacity-0 transition-opacity check-dot"></span></div></div><div class="group relative flex items-center justify-between w-full p-4 min-h-[104px] bg-surface-container-lowest rounded-xl shadow-sm cursor-pointer transition-all duration-200 active:scale-[0.99] hover:bg-surface-container-low" onclick="selectOption(this, 'pro')" role="button" tabindex="0"><div class="flex items-center flex-1 min-w-0"><div class="w-12 h-12 rounded-xl bg-surface-container flex items-center justify-center text-primary-container shrink-0 transition-colors group-hover:bg-primary-fixed"><span class="material-symbols-outlined text-[24px]">work</span></div><div class="flex flex-col text-right pr-3.5 pl-2 flex-1 min-w-0"><span class="text-[17px] text-on-surface font-semibold truncate leading-snug">العمل المهني</span><span class="text-[14px] text-on-surface-variant truncate mt-1">المونتاج والتصميم ثلاثي الأبعاد والبرمجة</span></div></div><div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center shrink-0 mr-2 transition-colors indicator-circle"><span class="w-2.5 h-2.5 rounded-full bg-primary-container opacity-0 transition-opacity check-dot"></span></div></div></div>
<!-- Moroccan Market Assurance Badge -->
<div class="flex items-center justify-center w-full mt-space-xl pt-space-md"><p class="text-[14px] text-on-surface-variant font-normal text-center">مجاني · بدون حساب · الأسعار بالدرهم</p></div>
</div>
<script>
  function selectOption(element, value) {
    const allCards = document.querySelectorAll('#options-group > div');
    
    allCards.forEach(card => {
      card.classList.remove('bg-surface-container-high');
      card.classList.add('bg-surface-container-lowest');
      
      const indicator = card.querySelector('.indicator-circle');
      if (indicator) {
        indicator.classList.remove('bg-primary-container');
        indicator.classList.add('bg-surface-container-high');
      }
      
      const dot = card.querySelector('.check-dot');
      if (dot) {
        dot.classList.add('opacity-0');
      }
    });

    element.classList.remove('bg-surface-container-lowest');
    element.classList.add('bg-surface-container-high');
    
    const indicator = element.querySelector('.indicator-circle');
    if (indicator) {
      indicator.classList.remove('bg-surface-container-high');
      indicator.classList.add('bg-primary-container');
    }
    
    const dot = element.querySelector('.check-dot');
    if (dot) {
      dot.classList.remove('opacity-0');
    }

    // Gentle progression pause to give tactile satisfaction before navigating
    setTimeout(() => {
      console.log('Selected usage:', value);
    }, 240);
  }
</script></main>

</body></html>
