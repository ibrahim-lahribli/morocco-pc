<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#f8f9ff;}body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-surface": "#0b1c30", "on-primary": "#ffffff", "primary": "#1f108e", "surface-container": "#e5eeff", "inverse-surface": "#213145", "error": "#ba1a1a", "tertiary-container": "#004d33", "surface": "#f8f9ff", "on-primary-fixed": "#0f0069", "primary-fixed-dim": "#c3c0ff", "surface-container-low": "#eff4ff", "outline": "#777584", "on-tertiary-container": "#2dc68d", "secondary": "#855300", "secondary-fixed": "#ffddb8", "surface-tint": "#544fc0", "on-secondary": "#ffffff", "inverse-primary": "#c3c0ff", "surface-container-high": "#dce9ff", "on-tertiary-fixed-variant": "#005236", "on-primary-container": "#a9a7ff", "on-tertiary-fixed": "#002113", "surface-container-lowest": "#ffffff", "error-container": "#ffdad6", "surface-container-highest": "#d3e4fe", "primary-fixed": "#e2dfff", "on-surface-variant": "#464553", "tertiary-fixed-dim": "#4edea3", "tertiary": "#003421", "background": "#f8f9ff", "surface-bright": "#f8f9ff", "on-secondary-container": "#684000", "on-error-container": "#93000a", "secondary-container": "#fea619", "on-error": "#ffffff", "on-secondary-fixed-variant": "#653e00", "on-background": "#0b1c30", "surface-dim": "#cbdbf5", "tertiary-fixed": "#6ffbbe", "on-secondary-fixed": "#2a1700", "surface-variant": "#d3e4fe", "on-primary-fixed-variant": "#3b35a7", "on-tertiary": "#ffffff", "outline-variant": "#c8c4d5", "primary-container": "#3730a3", "secondary-fixed-dim": "#ffb95f", "inverse-on-surface": "#eaf1ff" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "gutter": "1.25rem", "margin-mobile": "1rem", "space-xl": "2.5rem", "space-lg": "1.5rem", "margin": "2rem", "space-xs": "0.25rem", "space-sm": "0.5rem", "space-md": "1rem", "gutter-mobile": "0.75rem" }, "fontFamily": { "body-lg": ["Inter"], "display-lg": ["Inter"], "headline-md": ["Inter"], "headline-sm": ["Inter"], "label-md": ["Inter"], "display-lg-mobile": ["Inter"], "price-display": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "label-lg": ["Inter"], "label-sm": ["Inter"], "headline-lg": ["Inter"] }, "fontSize": { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-md": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }], "display-lg-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "price-display": ["24px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "label-sm": ["10px", { "lineHeight": "12px", "letterSpacing": "0.04em", "fontWeight": "600" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-on-surface antialiased flex flex-col min-h-screen"><header class="fixed top-0 w-full z-50 bg-surface/90 backdrop-blur-xl pt-safe border-b border-surface-container-high/40"><div class="h-16 px-margin-mobile flex items-center justify-between gap-3 max-w-md mx-auto"><button aria-label="Retour" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all" onclick="history.back()" type="button"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex-1 flex items-center justify-center gap-2.5 px-1"><div class="flex-1 max-w-[140px] flex items-center gap-1.5"><div class="h-1.5 flex-1 rounded-full bg-primary-container"></div><div class="h-1.5 flex-1 rounded-full bg-primary-container"></div><div class="h-1.5 flex-1 rounded-full bg-primary-container"></div><div class="h-1.5 flex-1 rounded-full bg-surface-container-high"></div></div><span class="text-[13px] text-outline font-medium tracking-tight shrink-0">3 / 4</span></div><button aria-label="Basculer la langue" class="h-9 px-2 rounded-lg text-outline flex items-center gap-1 hover:text-on-surface active:scale-95 transition-transform text-[12px] font-medium" type="button"><span class="font-semibold text-primary">FR</span><span class="text-outline-variant text-[10px]">|</span><span class="">عربية</span></button></div></header><main class="flex-1 w-full bg-surface pt-16 pb-28"><div class="flex flex-col w-full">
<div class="w-full max-w-md mx-auto px-margin-mobile flex flex-col pt-space-xs pb-space-lg">
<div class="pt-space-xs pb-space-md">
<h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight">Sur quel écran allez-vous l'utiliser ?</h1>
</div>
<div aria-label="Résolution d'écran souhaitée" class="flex flex-col gap-4" id="screen-options-group" role="radiogroup"><div aria-checked="false" class="screen-card cursor-pointer select-none bg-surface-container-lowest rounded-2xl p-4 shadow-sm transition-all duration-200 flex items-center justify-between gap-3.5 hover:shadow-md active:scale-[0.99] min-h-[104px] border border-transparent" data-value="1080p" id="card-1080p" role="radio" tabindex="0"><div class="flex items-center gap-3.5 min-w-0"><div class="card-icon-box w-12 h-12 rounded-xl bg-surface-container-low flex items-center justify-center shrink-0 text-primary transition-colors"><span class="material-symbols-outlined text-[26px]">desktop_windows</span></div><div class="flex flex-col min-w-0"><div class="flex items-center gap-2"><span class="font-headline-sm text-headline-sm text-on-surface">Full HD (1080p)</span></div><p class="font-body-md text-body-md text-on-surface-variant mt-0.5 leading-relaxed">Le plus courant. Écrans de 24 pouces.</p></div></div><div class="radio-indicator shrink-0 w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all bg-transparent"><div class="radio-inner w-2.5 h-2.5 rounded-full bg-transparent transition-all"></div></div></div><div aria-checked="false" class="screen-card cursor-pointer select-none bg-surface-container-lowest rounded-2xl p-4 shadow-sm transition-all duration-200 flex items-center justify-between gap-3.5 hover:shadow-md active:scale-[0.99] min-h-[104px] border border-transparent" data-value="1440p" id="card-1440p" role="radio" tabindex="0"><div class="flex items-center gap-3.5 min-w-0"><div class="card-icon-box w-12 h-12 rounded-xl bg-surface-container-low flex items-center justify-center shrink-0 text-primary transition-colors"><span class="material-symbols-outlined text-[26px]">monitor</span></div><div class="flex flex-col min-w-0"><div class="flex items-center gap-2"><span class="font-headline-sm text-headline-sm text-on-surface">QHD (1440p)</span></div><p class="font-body-md text-body-md text-on-surface-variant mt-0.5 leading-relaxed">Image plus nette, demande plus de puissance.</p></div></div><div class="radio-indicator shrink-0 w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all bg-transparent"><div class="radio-inner w-2.5 h-2.5 rounded-full bg-transparent transition-all"></div></div></div><div aria-checked="false" class="screen-card cursor-pointer select-none bg-surface-container-lowest rounded-2xl p-4 shadow-sm transition-all duration-200 flex items-center justify-between gap-3.5 hover:shadow-md active:scale-[0.99] min-h-[104px] border border-transparent" data-value="2160p" id="card-2160p" role="radio" tabindex="0"><div class="flex items-center gap-3.5 min-w-0"><div class="card-icon-box w-12 h-12 rounded-xl bg-surface-container-low flex items-center justify-center shrink-0 text-primary transition-colors"><span class="material-symbols-outlined text-[26px]">tv</span></div><div class="flex flex-col min-w-0"><div class="flex items-center gap-2"><span class="font-headline-sm text-headline-sm text-on-surface">4K (2160p)</span></div><p class="font-body-md text-body-md text-on-surface-variant mt-0.5 leading-relaxed">Grands écrans et TV. Budget élevé.</p></div></div><div class="radio-indicator shrink-0 w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center transition-all bg-transparent"><div class="radio-inner w-2.5 h-2.5 rounded-full bg-transparent transition-all"></div></div></div></div>
<div class="pt-5 flex items-center justify-center">
<button class="h-11 px-3 text-primary font-label-lg text-label-lg underline underline-offset-4 decoration-primary/40 hover:decoration-primary active:opacity-75 transition-all flex items-center gap-1.5 focus:outline-none" id="btn-auto-1080p" type="button"><span class="">Je ne sais pas, choisir Full HD</span></button>
</div>

</div>
<div class="fixed bottom-0 left-0 right-0 z-40 bg-surface/95 backdrop-blur-md pb-safe">
<div class="max-w-md mx-auto px-margin-mobile py-3 flex items-center justify-between gap-3 shadow-[0_-4px_20px_-2px_rgba(15,23,42,0.06)]">
<button aria-label="Passer à l'étape suivante" class="w-full h-14 rounded-xl font-label-lg text-label-lg transition-all duration-200 flex items-center justify-center gap-2 bg-surface-container-high text-outline cursor-not-allowed shadow-none active:scale-[0.98]" disabled="" id="btn-continue" type="button">
<span class="">Continuer</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</div>
<script>
    (function() {
      const cards = document.querySelectorAll('.screen-card');
      const continueBtn = document.getElementById('btn-continue');
      const autoPickBtn = document.getElementById('btn-auto-1080p');
      let selectedValue = null;

      function selectResolution(targetCard) {
        if (!targetCard) return;
        const val = targetCard.getAttribute('data-value');
        selectedValue = val;

        cards.forEach((c) => {
          const isCurrent = c === targetCard;
          c.setAttribute('aria-checked', isCurrent ? 'true' : 'false');
          const indicator = c.querySelector('.radio-indicator');
          const inner = c.querySelector('.radio-inner');
          const iconBox = c.querySelector('.card-icon-box');

          if (isCurrent) {
            c.classList.remove('bg-surface-container-lowest', 'shadow-sm');
            c.classList.add('bg-surface-container-low', 'shadow-md', 'scale-[1.01]');
            
            indicator.classList.remove('bg-surface-container-high');
            indicator.classList.add('bg-primary-container');
            
            inner.classList.remove('bg-transparent');
            inner.classList.add('bg-on-primary');

            iconBox.classList.remove('bg-surface-container-low');
            iconBox.classList.add('bg-primary-fixed', 'text-primary-container');
          } else {
            c.classList.add('bg-surface-container-lowest', 'shadow-sm');
            c.classList.remove('bg-surface-container-low', 'shadow-md', 'scale-[1.01]');
            
            indicator.classList.add('bg-surface-container-high');
            indicator.classList.remove('bg-primary-container');
            
            inner.classList.add('bg-transparent');
            inner.classList.remove('bg-on-primary');

            iconBox.classList.add('bg-surface-container-low');
            iconBox.classList.remove('bg-primary-fixed', 'text-primary-container');
          }
        });

        // Activer le bouton Continuer
        continueBtn.disabled = false;
        continueBtn.classList.remove('bg-surface-container-high', 'text-outline', 'cursor-not-allowed', 'shadow-none');
        continueBtn.classList.add('bg-primary-container', 'text-on-primary', 'shadow-md', 'hover:bg-primary');
      }

      cards.forEach((card) => {
        card.addEventListener('click', () => selectResolution(card));
        card.addEventListener('keydown', (e) => {
          if (e.key === ' ' || e.key === 'Enter') {
            e.preventDefault();
            selectResolution(card);
          }
        });
      });

      if (autoPickBtn) {
        autoPickBtn.addEventListener('click', () => {
          const card1080 = document.getElementById('card-1080p');
          if (card1080) {
            selectResolution(card1080);
            card1080.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
        });
      }

      if (continueBtn) {
        continueBtn.addEventListener('click', () => {
          if (!continueBtn.disabled && selectedValue) {
            // Prêt pour la transition vers l'étape 4 (Composants/Récapitulatif)
            console.log('Résolution sélectionnée :', selectedValue);
          }
        });
      }
    })();
  </script>
</div></main>


</body></html>
