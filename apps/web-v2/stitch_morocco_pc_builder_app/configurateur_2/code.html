<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"><meta content="mobile_blank" name="shell-type"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"><link href="https://fonts.googleapis.com" rel="preconnect"><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">

"#e2dfff", "tertiary-container": "#004d33", "on-primary-fixed": "#0f0069", "on-secondary-container": "#684000" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin-mobile": "1rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "gutter-mobile": "0.75rem", "gutter": "1.25rem", "space-xl": "2.5rem", "space-md": "1rem", "space-sm": "0.5rem", "margin": "2rem" }, "fontFamily": { "body-lg": ["Inter"], "display-lg-mobile": ["Inter"], "label-sm": ["Inter"], "display-lg": ["Inter"], "headline-lg": ["Inter"], "body-md": ["Inter"], "price-display": ["Inter"], "headline-md": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["Inter"], "label-lg": ["Inter"], "label-md": ["Inter"] }, "fontSize": { "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "display-lg-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "label-sm": ["10px", { "lineHeight": "12px", "letterSpacing": "0.04em", "fontWeight": "600" }], "display-lg": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }], "headline-lg": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.01em", "fontWeight": "600" }], "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "price-display": ["24px", { "lineHeight": "28px", "letterSpacing": "-0.01em", "fontWeight": "700" }], "headline-md": ["22px", { "lineHeight": "28px", "fontWeight": "600" }], "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }], "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }], "label-lg": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "label-md": ["12px", { "lineHeight": "16px", "fontWeight": "500" }] } } } }</script></head><body class="bg-surface text-on-surface font-body-md text-body-md min-h-screen flex flex-col pt-safe pb-safe selection:bg-primary-fixed selection:text-on-primary-fixed"><main class="flex-1 flex flex-col w-full relative bg-surface"><div class="flex flex-col w-full relative min-h-full pb-28" dir="rtl">
<!-- Top Navigation & Flow Header -->
<header class="w-full flex items-center justify-between px-margin-mobile py-space-sm gap-2">
<!-- Back Button (Right side in RTL, pointing right -> back) -->
<button aria-label="الرجوع إلى الخطوة السابقة" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container hover:bg-surface-container-high active:scale-95 transition-all text-on-surface" type="button">
<span class="material-symbols-outlined text-[24px]">arrow_forward</span>
</button>
<!-- Stepper & Counter (2 of 4 segments filled) -->
<div class="flex items-center gap-2 flex-1 justify-center max-w-[190px]">
<div aria-label="الخطوة 2 من 4" class="flex items-center gap-1.5 flex-1">
<!-- Segment 1 (Filled - Rightmost in RTL) -->
<span class="h-1.5 flex-1 rounded-full bg-primary-container"></span>
<!-- Segment 2 (Filled) -->
<span class="h-1.5 flex-1 rounded-full bg-primary-container"></span>
<!-- Segment 3 (Unfilled) -->
<span class="h-1.5 flex-1 rounded-full bg-surface-variant"></span>
<!-- Segment 4 (Unfilled - Leftmost in RTL) -->
<span class="h-1.5 flex-1 rounded-full bg-surface-variant"></span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant font-semibold select-none"><bdi dir="ltr" class="text-[14px]">2 / 4</bdi></span>
</div>
<!-- Language Selector Pill -->
<div class="flex items-center p-1 rounded-full bg-surface-container">
<span class="px-2.5 py-1 rounded-full bg-primary-container text-on-primary font-label-md text-label-md shadow-sm">عربية</span>
<span class="px-2 py-1 rounded-full text-on-surface-variant font-label-md text-label-md">FR</span>
</div>
</header>
<!-- Question Heading -->
<section class="px-margin-mobile pt-space-md pb-space-sm">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface font-bold text-right tracking-tight">
      ما ميزانيتك؟
    </h1>
</section>
<!-- Main Content Body -->
<div class="flex flex-col gap-space-md px-margin-mobile w-full">
<!-- Main Budget Card -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-lg shadow-sm flex flex-col gap-space-lg">
<!-- Amount Display -->
<div class="flex flex-col items-start gap-1">
<span class="text-[14px] text-on-surface-variant font-medium">ميزانيتك</span>
<div class="flex items-baseline gap-2"><span class="inline-flex items-baseline gap-2 whitespace-nowrap"><bdi dir="ltr" class="font-display-lg text-display-lg font-bold text-primary-container tracking-tight" id="budget-amount">8 000</bdi><span class="font-headline-md text-headline-md font-bold text-primary-container">درهم</span></span></div>
</div>
<!-- Interactive Slider Block -->
<div class="flex flex-col gap-2 w-full pt-1">
<div class="relative w-full h-10 flex items-center">
<!-- Background Track -->
<div class="absolute inset-x-0 h-2 bg-surface-variant rounded-full overflow-hidden">
<!-- Active Fill (From Right to Left in RTL: 4000 to 25000 range, 8000 is ~19%) -->
<div class="h-full bg-primary-container rounded-full" id="slider-track-fill" style="width: 19%;"></div>
</div>
<!-- Native input overlay for smooth accessible touch -->
<input aria-label="تحديد الميزانية بالدرهم" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" id="budget-slider" max="25000" min="4000" step="500" type="range" value="8000">
<!-- Mirrored Visual Thumb with Delight Glow -->
<div class="absolute top-1/2 -translate-y-1/2 w-7 h-7 bg-surface-container-lowest rounded-full shadow-md flex items-center justify-center pointer-events-none transition-transform" id="slider-thumb" style="right: calc(19% - 14px);">
<div class="w-3.5 h-3.5 rounded-full bg-primary-container"></div>
</div>
</div>
<!-- Min / Max Labels -->
<div class="flex items-center justify-between font-label-md text-label-md text-on-surface-variant font-medium"><span class="text-[14px] text-on-surface-variant font-medium"><bdi dir="ltr">4 000</bdi></span><span class="text-[14px] text-on-surface-variant font-medium"><bdi dir="ltr">25 000+</bdi></span></div>
</div>
<!-- Quick Pick Chips -->
<div class="w-full pt-space-xs">
<div class="grid grid-cols-5 gap-1.5 w-full" id="chips-container"><button class="chip-btn min-h-[44px] py-2 px-1 rounded-xl text-[13px] bg-surface-container text-on-surface-variant font-medium flex items-center justify-center active:scale-95 transition-all text-center" data-val="5000" type="button"><bdi dir="ltr">5 000</bdi></button><button class="chip-btn min-h-[44px] py-2 px-1 rounded-xl text-[13px] bg-primary-container text-on-primary font-semibold shadow-sm flex items-center justify-center active:scale-95 transition-all text-center" data-val="8000" type="button"><bdi dir="ltr">8 000</bdi></button><button class="chip-btn min-h-[44px] py-2 px-1 rounded-xl text-[13px] bg-surface-container text-on-surface-variant font-medium flex items-center justify-center active:scale-95 transition-all text-center" data-val="12000" type="button"><bdi dir="ltr">12 000</bdi></button><button class="chip-btn min-h-[44px] py-2 px-1 rounded-xl text-[13px] bg-surface-container text-on-surface-variant font-medium flex items-center justify-center active:scale-95 transition-all text-center" data-val="15000" type="button"><bdi dir="ltr">15 000</bdi></button><button class="chip-btn min-h-[44px] py-2 px-1 rounded-xl text-[13px] bg-surface-container text-on-surface-variant font-medium flex items-center justify-center active:scale-95 transition-all text-center" data-val="20000" type="button"><bdi dir="ltr">20 000+</bdi></button></div>
</div>
</div>
<!-- Contextual Tier Preview Card -->
<div class="w-full bg-surface-container-low rounded-2xl p-space-md flex flex-col gap-1.5 transition-all"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-[20px] text-primary-container shrink-0" style="font-variation-settings: 'FILL' 1;">auto_awesome</span><h2 class="font-headline-sm text-headline-sm font-semibold text-on-surface leading-snug" id="tier-title">ألعاب بدقة <bdi dir="ltr" class="inline-block font-sans font-bold">Full HD</bdi> بإعدادات متوسطة إلى عالية.</h2></div><p class="font-body-md text-body-md text-on-surface-variant pr-7" id="tier-subtitle">مكونات موثوقة وقابلة للترقية.</p></div>
<!-- Reassurance Helper Text -->
<div class="w-full text-center py-1">
<span class="text-[14px] text-on-surface-variant text-center font-normal">يمكنك تعديل الميزانية لاحقًا.</span>
</div>
</div>
<!-- Sticky Bottom CTA Area -->
<footer class="fixed bottom-0 inset-x-0 bg-surface-bright/90 backdrop-blur-md px-margin-mobile py-space-sm z-30 flex flex-col items-center">
<div class="w-full max-w-[390px]">
<button class="w-full h-14 min-h-[52px] bg-primary-container hover:bg-primary active:scale-[0.98] transition-all rounded-2xl text-on-primary font-headline-sm text-headline-sm font-semibold flex items-center justify-center gap-2.5 shadow-md" type="button">
<span class="">متابعة</span>
<span class="material-symbols-outlined text-[22px] transition-transform group-active:-translate-x-1">arrow_back</span>
</button>
</div>
</footer>
</div>
<script>
  (function () {
    const slider = document.getElementById('budget-slider');
    const amountDisplay = document.getElementById('budget-amount');
    const trackFill = document.getElementById('slider-track-fill');
    const thumb = document.getElementById('slider-thumb');
    const chips = document.querySelectorAll('.chip-btn');
    const tierTitle = document.getElementById('tier-title');
    const tierSubtitle = document.getElementById('tier-subtitle');

    const min = 4000;
    const max = 25000;

    function formatNumber(num) {
      return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    }

    function updateTierContent(val) {
      if (val < 7000) {
        tierTitle.innerHTML = 'تصفح سريع وألعاب خفيفة بدقة <span dir="ltr" class="inline-block font-sans font-bold">720p</span>.';
        tierSubtitle.textContent = 'أداء اقتصادي متوازن للمهام اليومية.';
      } else if (val < 13000) {
        tierTitle.innerHTML = 'ألعاب بدقة <span dir="ltr" class="inline-block font-sans font-bold">Full HD</span> بإعدادات متوسطة إلى عالية.';
        tierSubtitle.textContent = 'مكونات موثوقة وقابلة للترقية.';
      } else if (val < 18000) {
        tierTitle.innerHTML = 'تجربة ألعاب متقدمة بدقة <span dir="ltr" class="inline-block font-sans font-bold">2K 1440p</span> وصناعة محتوى.';
        tierSubtitle.textContent = 'معالجات قوية مع بطاقات رسومية حديثة.';
      } else {
        tierTitle.innerHTML = 'أعلى أداء ألعاب بدقة <span dir="ltr" class="inline-block font-sans font-bold">4K Ultra</span> وإنتاج احترافي.';
        tierSubtitle.textContent = 'أفضل القطع المتوفرة مع تبريد متطور.';
      }
    }

    function setBudget(val) {
      const clampedVal = Math.min(Math.max(val, min), max);
      slider.value = clampedVal;
      amountDisplay.textContent = formatNumber(clampedVal);

      const percent = ((clampedVal - min) / (max - min)) * 100;
      trackFill.style.width = percent + '%';
      thumb.style.right = 'calc(' + percent + '% - 14px)';

      chips.forEach(chip => {
        const chipVal = parseInt(chip.getAttribute('data-val'), 10);
        if (chipVal === clampedVal) {
          chip.classList.remove('bg-surface-container', 'text-on-surface-variant');
          chip.classList.add('bg-primary-container', 'text-on-primary', 'shadow-sm', 'font-semibold');
        } else {
          chip.classList.add('bg-surface-container', 'text-on-surface-variant');
          chip.classList.remove('bg-primary-container', 'text-on-primary', 'shadow-sm', 'font-semibold');
        }
      });

      updateTierContent(clampedVal);
    }

    slider.addEventListener('input', function (e) {
      setBudget(parseInt(e.target.value, 10));
    });

    chips.forEach(chip => {
      chip.addEventListener('click', function () {
        const val = parseInt(this.getAttribute('data-val'), 10);
        setBudget(val);
      });
    });
  })();
</script></main>

</body></html>
