<script>
  function updateFilterState() {
    var amd = document.getElementById('brand-amd').checked;
    var nvidia = document.getElementById('brand-nvidia').checked;
    var total = (amd ? 3 : 0) + (nvidia ? 3 : 0);
    var applyBtn = document.getElementById('apply-btn');
    if (total === 0) {
      applyBtn.textContent = 'Aucun résultat';
      applyBtn.disabled = true;
      applyBtn.classList.add('opacity-50', 'pointer-events-none');
    } else {
      applyBtn.textContent = 'Afficher ' + total + ' résultats';
      applyBtn.disabled = false;
      applyBtn.classList.remove('opacity-50', 'pointer-events-none');
    }
  }

  function resetFilters() {
    var amd = document.getElementById('brand-amd');
    var nvidia = document.getElementById('brand-nvidia');
    amd.checked = false;
    nvidia.checked = false;
    updateFilterState();
  }
