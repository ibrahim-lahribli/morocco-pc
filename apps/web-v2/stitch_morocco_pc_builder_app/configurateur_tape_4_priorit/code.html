<!-- Dynamic Step Updater for Global Shell Navigation Indicator -->
<script>
    (function() {
      // Sync global shell top bar indicator to 4 / 4
      const progressBars = document.querySelectorAll('header .h-1\\.5');
      if (progressBars && progressBars.length >= 4) {
        progressBars.forEach(bar => {
          bar.className = 'h-1.5 flex-1 rounded-full bg-primary-container';
        });
      }
      const stepText = document.querySelector('header span.text-\\[13px\\]');
      if (stepText) {
        stepText.textContent = '4 / 4';
        stepText.className = 'text-[13px] text-primary-container font-semibold tracking-tight shrink-0';
      }
    })();
  </script>

  <div class="flex items-start gap-3.5 min-w-0 flex-1">

  </div>
  <!-- Radio Indicator (Crisp outline circle) -->
  <div class="radio-pill shrink-0 w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center ml-2 transition-all">

<!-- Option 2: Équilibré (Preselected by default) -->
<div aria-checked="true" class="priority-card w-full cursor-pointer rounded-xl bg-surface-container-low p-space-md flex items-center justify-between gap-3.5 shadow-sm transition-all duration-150 active:scale-[0.99] focus:outline-none min-h-[104px] ring-2 ring-primary-container" id="option-card-balanced" onclick="selectPriority('balanced')" onkeydown="if(event.key==='Enter'||event.key===' ') selectPriority('balanced')" role="radio" tabindex="0">
  <div class="flex items-start gap-3.5 min-w-0 flex-1">
    <!-- Icon Capsule (Harmonized light style matching others) -->
    <div class="icon-capsule w-12 h-12 rounded-xl bg-surface-container-high text-primary flex items-center justify-center shrink-0 transition-colors">
      <span class="material-symbols-outlined text-[26px]">balance</span>
    </div>
    <!-- Label & Detail -->
    <div class="flex flex-col justify-center min-w-0 flex-1">
      <div class="flex items-center flex-wrap gap-2">
        <span class="font-headline-sm text-headline-sm text-on-surface font-semibold">Équilibré</span>
        <span class="inline-flex items-center px-2 py-0.5 rounded-full font-label-sm text-label-sm bg-primary-fixed text-on-primary-fixed font-bold tracking-wide">

      </div>
      <p class="font-body-md text-body-md text-on-surface-variant mt-1 leading-snug">

  </div>
  <!-- Radio Indicator (Filled indigo on selected card) -->
  <div class="radio-pill shrink-0 w-6 h-6 rounded-full bg-primary-container flex items-center justify-center ml-2 shadow-sm transition-all">
    <div class="inner-dot w-2.5 h-2.5 rounded-full bg-on-primary opacity-100 transition-opacity"></div>
  </div>
</div>

<!-- Option 3: Performance avant tout -->
<div aria-checked="false" class="priority-card w-full cursor-pointer rounded-xl bg-surface-container-lowest p-space-md flex items-center justify-between gap-3.5 shadow-sm transition-all duration-150 active:scale-[0.99] focus:outline-none min-h-[104px] border border-outline-variant/30" id="option-card-perf" onclick="selectPriority('perf')" onkeydown="if(event.key==='Enter'||event.key===' ') selectPriority('perf')" role="radio" tabindex="0">
  <div class="flex items-start gap-3.5 min-w-0 flex-1">
    <!-- Icon Capsule (Subtle light style) -->
    <div class="icon-capsule w-12 h-12 rounded-xl bg-surface-container-low text-primary flex items-center justify-center shrink-0 transition-colors">
      <span class="material-symbols-outlined text-[26px]">bolt</span>
    </div>
    <!-- Label & Detail -->
    <div class="flex flex-col justify-center min-w-0 flex-1">
      <div class="flex items-center gap-2">
        <span class="font-headline-sm text-headline-sm text-on-surface font-semibold">Performance avant tout</span>

<!-- Previous User Selections Summary (Chips Bar) -->
<div class="mt-space-lg pt-space-xs flex flex-col gap-2"><div class="flex items-center justify-between px-0.5 mb-1">
  <span class="text-[13px] text-outline font-medium">Votre choix</span>
</div>

  </button>
  <!-- Chip 2: Budget -->
  <button class="flex items-center justify-center gap-1.5 h-10 px-2 rounded-full bg-surface-container-lowest shadow-sm hover:bg-surface-container active:scale-95 transition-all text-on-surface w-full" onclick="history.back()" type="button">
    <span class="material-symbols-outlined text-[18px] text-secondary shrink-0">payments</span>

<!-- Sticky Bottom Bar CTA -->

<button class="w-full h-14 rounded-xl bg-primary-container text-on-primary flex items-center justify-center gap-2 shadow-lg shadow-primary-container/20 active:scale-[0.98] transition-all hover:bg-primary font-headline-sm text-headline-sm font-semibold tracking-tight" id="cta-generate-build" onclick="submitConfiguration()" type="button">
<span class="">Voir mes configurations</span>
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
</div>
</div>
<!-- Interactive State Handler Script -->
<script>
    let currentPriority = 'balanced';

    const priorityConfigs = {
      price: {
        id: 'option-card-price',
        iconName: 'savings',
        label: 'Prix avant tout'
      },
      balanced: {
        id: 'option-card-balanced',
        iconName: 'balance',
        label: 'Équilibré'
      },
      perf: {
        id: 'option-card-perf',
        iconName: 'bolt',
        label: 'Performance avant tout'
      }
    };

    function selectPriority(selectedKey) {
      currentPriority = selectedKey;

      Object.keys(priorityConfigs).forEach((key) => {
        const card = document.getElementById(priorityConfigs[key].id);
        if (!card) return;

        const iconCapsule = card.querySelector('.icon-capsule');
        const radioPill = card.querySelector('.radio-pill');
        const innerDot = card.querySelector('.inner-dot');
        const iconSpan = iconCapsule ? iconCapsule.querySelector('.material-symbols-outlined') : null;

        if (key === selectedKey) {
          // Active state styling
          card.setAttribute('aria-checked', 'true');
          card.className = 'priority-card w-full cursor-pointer rounded-xl bg-surface-container-low p-space-md flex items-center justify-between gap-3.5 shadow-md transition-all duration-150 active:scale-[0.99] focus:outline-none min-h-[104px] ring-2 ring-primary-container';
          
          if (iconCapsule) {
            iconCapsule.className = 'icon-capsule w-12 h-12 rounded-xl bg-primary text-on-primary flex items-center justify-center shrink-0 transition-colors shadow-sm';
          }
          if (iconSpan) {
            iconSpan.style.fontVariationSettings = "'FILL' 1";
          }
          if (radioPill) {
            radioPill.className = 'radio-pill shrink-0 w-6 h-6 rounded-full bg-primary-container flex items-center justify-center ml-2 shadow-sm transition-all';
          }
          if (innerDot) {
            innerDot.className = 'inner-dot w-2.5 h-2.5 rounded-full bg-on-primary opacity-100 transition-opacity';
          }
        } else {
          // Inactive state styling
          card.setAttribute('aria-checked', 'false');
          card.className = 'priority-card w-full cursor-pointer rounded-xl bg-surface-container-lowest p-space-md flex items-center justify-between gap-3.5 shadow-sm transition-all duration-150 active:scale-[0.99] focus:outline-none min-h-[104px]';
          
          if (iconCapsule) {
            iconCapsule.className = 'icon-capsule w-12 h-12 rounded-xl bg-surface-container-low text-primary flex items-center justify-center shrink-0 transition-colors';
          }
          if (iconSpan) {
            iconSpan.style.fontVariationSettings = "'FILL' 0";
          }
          if (radioPill) {
            radioPill.className = 'radio-pill shrink-0 w-6 h-6 rounded-full bg-surface-container-lowest flex items-center justify-center shadow-inner ml-2 transition-all';
          }
          if (innerDot) {
            innerDot.className = 'inner-dot w-2.5 h-2.5 rounded-full bg-surface-container-lowest opacity-0 transition-opacity';
          }
        }
      });
    }

    function submitConfiguration() {
      const button = document.getElementById('cta-generate-build');
      if (!button) return;

      button.classList.add('opacity-80', 'pointer-events-none');
      button.innerHTML = `
        <span class="inline-block animate-spin mr-2">
          <span class="material-symbols-outlined text-[20px]">sync</span>
        </span>
        <span>Calcul des builds en cours...</span>
      `;

      // Simuler la transition vers les résultats
      setTimeout(() => {
        window.location.hash = '#configurations-maroc';
      }, 600);
    }
  </script>
</div></main>
