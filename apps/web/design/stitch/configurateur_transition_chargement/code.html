  (function () {

    let currentIndex = 0;
    const textElement = document.getElementById("dynamic-status-text");

    if (textElement) {
      setInterval(() => {
        textElement.style.opacity = "0";
        setTimeout(() => {
          currentIndex = (currentIndex + 1) % statuses.length;

          textElement.style.opacity = "1";
        }, 300);
      }, 2500);
    }
