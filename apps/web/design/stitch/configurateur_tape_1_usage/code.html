 text-left active:scale-[0.99]'; radio.className = 'radio-indicator w-6 h-6 rounded-full border-2 border-outline-variant bg-transparent flex items-center justify-center shrink-0'; dot.className = 'w-2 h-2 rounded-full bg-transparent'; if (iconBox) { iconBox.className = 'w-12 h-12 rounded-xl bg-surface-container-low text-on-surface-variant flex items-center justify-center shrink-0'; } } }); }</script><p class="text-[13px] font-medium text-outline text-center mt-6">Gratuit · Sans compte · Prix en dirhams</p></div><script>let chosenBudget = 8000; function updateBudgetSlider(val) { chosenBudget = parseInt(val, 10); const formatted = new Intl.NumberFormat('fr-FR').format(chosenBudget); const disp = document.getElementById('budget-number-display'); if (disp) disp.textContent = (chosenBudget >= 25000) ? '25 000+' : formatted; const chips = document.querySelectorAll('.budget-chip'); chips.forEach(c => { const chipVal = parseInt(c.textContent.replace(/[^0-9]/g, ''), 10); if ((chosenBudget >= 25000 && chipVal === 25000) || chipVal === chosenBudget) { c.className = 'budget-chip active-chip h-12 px-4 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg font-bold shadow-sm active:scale-95 transition-all flex items-center justify-center'; } else { c.className = 'budget-chip h-12 px-4 rounded-xl bg-surface-container-low text-on-surface font-label-lg text-label-lg font-medium active:scale-95 transition-all flex items-center justify-center'; } }); } function setBudgetAmount(amount) { const slider = document.getElementById('budget-range'); if (slider) slider.value = amount; updateBudgetSlider(amount); }</script></main>
