 aria-label="Retour" class="w-12 h-12 rounded-full flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all" type="button" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><div class="flex-1 flex items-center justify-center gap-2.5 px-1"><div class="flex-1 max-w-[140px] flex items-center gap-1.5"><div class="h-1.5 flex-1 rounded-full bg-primary-container"></div><div class="h-1.5 flex-1 rounded-full bg-primary-container"></div><div class="h-1.5 flex-1 rounded-full bg-surface-container-high"></div><div class="h-1.5 flex-1 rounded-full bg-surface-container-high"></div></div><span class="text-[13px] text-outline font-medium tracking-tight shrink-0">2 / 4</span></div><button aria-label="Basculer la langue" class="h-9 px-2 rounded-lg text-outline flex items-center gap-1 hover:text-on-surface active:scale-95 transition-transform text-[12px] font-medium" type="button"><span class="font-semibold text-primary">FR</span><span class="text-outline-variant text-[10px]">|</span><span class="">عربية</span></button></div></header><main class="flex-1 w-full bg-surface pt-16 pb-28"><div class="flex flex-col w-full max-w-md mx-auto px-margin-mobile pt-4 pb-28"><h1 class="font-headline-lg text-headline-lg font-bold text-on-surface tracking-tight mb-5">Quel est votre budget ?</h1><div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm border border-surface-container-high/60 flex flex-col"><span class="text-[13px] font-medium text-outline mb-2">Votre budget</span><div class="flex items-baseline gap-2 mb-6"><span class="text-[44px] leading-none font-bold text-primary tracking-tight" id="budget-number-display">8 000</span><span class="font-headline-md text-headline-md font-bold text-primary">DH</span></div><div class="w-full mb-6"><style>#budget-range::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #3730a3; cursor: pointer; box-shadow: 0 2px 6px rgba(55,48,163,0.35); border: 2px solid #ffffff; } #budget-range::-moz-range-thumb { width: 28px; height: 28px; border-radius: 50%; background: #3730a3; cursor: pointer; box-shadow: 0 2px 6px rgba(55,48,163,0.35); border: 2px solid #ffffff; }</style><input class="w-full h-2 rounded-full appearance-none cursor-pointer accent-primary-container" id="budget-range" max="25000" min="4000" oninput="updateBudgetSlider(this.value)" step="500" type="range" value="8000" style="background: linear-gradient(to right, rgb(55, 48, 163) 0%, rgb(55, 48, 163) 19.04%, rgb(239, 244, 255) 19.04%, rgb(239, 244, 255) 100%);"><div class="flex justify-between items-center mt-2 font-label-md text-label-md text-outline font-medium"><span class="">4 000 DH</span><span class="">25 000+ DH</span></div></div><div class="grid grid-cols-3 gap-2 w-full"><button class="budget-chip h-12 rounded-xl bg-surface-container-low text-on-surface font-label-lg text-label-lg font-medium active:scale-95 transition-all flex items-center justify-center" onclick="setBudgetAmount(5000)">5 000</button><button class="budget-chip active-chip h-12 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg font-bold shadow-sm active:scale-95 transition-all flex items-center justify-center" onclick="setBudgetAmount(8000)">8 000</button><button class="budget-chip h-12 rounded-xl bg-surface-container-low text-on-surface font-label-lg text-label-lg font-medium active:scale-95 transition-all flex items-center justify-center" onclick="setBudgetAmount(12000)">12 000</button><button class="budget-chip h-12 rounded-xl bg-surface-container-low text-on-surface font-label-lg text-label-lg font-medium active:scale-95 transition-all flex items-center justify-center" onclick="setBudgetAmount(15000)">15 000</button><button class="budget-chip h-12 rounded-xl bg-surface-container-low text-on-surface font-label-lg text-label-lg font-medium active:scale-95 transition-all flex items-center justify-center col-span-2" onclick="setBudgetAmount(20000)">20 000+</button></div></div><div class="mt-4 p-4 rounded-2xl bg-surface-container-low flex items-start gap-3.5"><div class="w-10 h-10 rounded-xl bg-surface-container-lowest shadow-sm flex items-center justify-center text-primary-container shrink-0"><span class="material-symbols-outlined text-[22px] text-primary">auto_awesome</span></div><div class="flex flex-col gap-0.5"><p class="font-label-lg text-label-lg font-semibold text-on-surface">Jeux en Full HD, réglages moyens à élevés.</p><p class="font-body-md text-body-md text-on-surface-variant">Composants fiables et évolutifs.</p></div></div><p class="text-[13px] font-medium text-outline text-center mt-3">Vous pourrez ajuster ce budget plus tard.</p></div><div class="fixed bottom-0 left-0 w-full bg-surface/95 backdrop-blur-md pb-safe border-t border-surface-container-high/40 z-40"><div class="max-w-md mx-auto p-4"><button class="w-full h-14 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg font-bold shadow-md hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="wizard-cta-btn"><span id="cta-label-text" class="">Continuer</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span></button></div></div><script>let chosenBudget = 8000; function updateBudgetSlider(val) { chosenBudget = parseInt(val, 10); const formatted = new Intl.NumberFormat('fr-FR').format(chosenBudget); const disp = document.getElementById('budget-number-display'); if (disp) disp.textContent = (chosenBudget >= 25000) ? '25 000+' : formatted; const chips = document.querySelectorAll('.budget-chip'); chips.forEach(c => { const chipVal = parseInt(c.textContent.replace(/[^0-9]/g, ''), 10); if ((chosenBudget >= 25000 && chipVal === 25000) || chipVal === chosenBudget) { c.className = 'budget-chip active-chip h-12 px-4 rounded-xl bg-primary-container text-on-primary font-label-lg text-label-lg font-bold shadow-sm active:scale-95 transition-all flex items-center justify-center'; } else { c.className = 'budget-chip h-12 px-4 rounded-xl bg-surface-container-low text-on-surface font-label-lg text-label-lg font-medium active:scale-95 transition-all flex items-center justify-center'; } }); } function setBudgetAmount(amount) { const slider = document.getElementById('budget-range'); if (slider) slider.value = amount; updateBudgetSlider(amount); }</script></main>
